---
description: Classify human prompts from Claude Code transcripts with NLP models (called from claude-code-transcript)
processors:
- inference:
    on_failure:
    - append:
        field: claude_code.prompt_classification.errors
        value: 'injection: {{{_ingest.on_failure_message}}}'
        tag: classify-injection_on_failure_append_claude_code_prompt_classification_errors
    target_field: _ml.injection
    inference_config:
      text_classification:
        num_top_classes: -1
    field_map:
      message: text_field
    tag: classify-injection
    model_id: protectai__deberta-v3-base-prompt-injection-v2
- script:
    ignore_failure: true
    description: Elapsed ms of the preceding inference step (injection_ms)
    tag: inference-timer-injection
    params:
      step: injection_ms
    lang: painless
    source: long n = System.nanoTime(); if (ctx._inf_mark != null) { Map cc = ctx.claude_code; if (cc == null) { cc = new HashMap(); ctx.claude_code = cc; } Map inf = cc.inference; if (inf == null) { inf = new HashMap(); cc.inference = inf; } double ms = Math.round((n - ((Number) ctx._inf_mark).longValue()) / 100000.0) / 10.0; if (params.containsKey('top') && params.top == true) { inf[params.step] = ms; } else { Map st = inf.steps; if (st == null) { st = new HashMap(); inf.steps = st; } st[params.step] = ms; } } ctx._inf_mark = n;
