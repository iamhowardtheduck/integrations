---
description: Classify human prompts from Claude Code transcripts with NLP models (called from claude-code-transcript)
processors:
- inference:
    on_failure:
    - append:
        field: claude_code.prompt_classification.errors
        value: 'injection: {{{_ingest.on_failure_message}}}'
        tag: classify-injection_on_failure_append_claude_code_prompt_classification_errors
    target_field: claude_code.tmp.ml.injection
    inference_config:
      text_classification:
        num_top_classes: -1
    field_map:
      message: text_field
    tag: classify-injection
    model_id: protectai__deberta-v3-base-prompt-injection-v2
- script:
    ignore_failure: true
    description: Record the duration of the preceding model call in claude_code.inference.steps.injection_ms.
    tag: inference-timer-injection
    params:
      step: injection_ms
    lang: painless
    source: |
      // Elapsed time since the previous mark, in ms with one decimal. The step is recorded
      // in claude_code.inference.<step> when params.top is set, otherwise in
      // claude_code.inference.steps.<step>. Then the mark moves to now.
      long n = System.nanoTime();
      Map cc = ctx.claude_code;
      if (cc == null) {
        cc = new HashMap();
        ctx.claude_code = cc;
      }
      Map tmp = cc.tmp;
      if (tmp == null) {
        tmp = new HashMap();
        cc.tmp = tmp;
      }
      if (tmp.inf_mark != null) {
        Map inf = cc.inference;
        if (inf == null) {
          inf = new HashMap();
          cc.inference = inf;
        }
        double ms = Math.round((n - ((Number) tmp.inf_mark).longValue()) / 100000.0) / 10.0;
        if (params.containsKey('top') && params.top == true) {
          inf[params.step] = ms;
        } else {
          Map st = inf.steps;
          if (st == null) {
            st = new HashMap();
            inf.steps = st;
          }
          st[params.step] = ms;
        }
      }
      tmp.inf_mark = n;
