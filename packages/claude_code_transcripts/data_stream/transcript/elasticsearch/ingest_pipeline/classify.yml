- script:
    tag: aggregate
    description: >-
      Collect the model outputs from claude_code.tmp.ml into
      claude_code.prompt_classification: scores for every model, categories (<group>:<label>,
      pii:<type>) for results at or above their thresholds in params, the named entities by
      type, and flagged when any category in a flag list is hit.
    source: |
      // prob() returns the probability of one class from a text_classification result,
      // which lists every class (num_top_classes: -1).
      def prob(def r, String label) {
        if (r == null || r.top_classes == null) {
          return null;
        }
        for (def c : r.top_classes) {
          if (c.class_name == label) {
            return c.class_probability;
          }
        }
        return null;
      }

      def ml = ctx.claude_code.tmp?.ml;
      if (ml == null) {
        return;
      }
      def pc = ctx.claude_code.prompt_classification;
      if (pc == null) {
        pc = new HashMap();
        ctx.claude_code.prompt_classification = pc;
      }
      List cats = new ArrayList();
      Map scores = new HashMap();
      boolean flagged = false;

      // Binary classifiers. Scores are always kept. A classifier marked agree flags only
      // when every agree classifier passes its threshold; the others flag on their own.
      boolean agreeAll = true;
      boolean agreeAny = false;
      for (def b : params.binary) {
        def p = prob(ml[b.name], b.label);
        if (p == null) {
          if (b.agree == true) {
            agreeAll = false;
          }
          continue;
        }
        scores[b.category] = p;
        if (b.agree == true) {
          agreeAny = true;
          if (p < b.t) {
            agreeAll = false;
          }
        } else if (p >= b.t) {
          cats.add(b.category);
          flagged = true;
        }
      }
      if (agreeAny && agreeAll) {
        for (def b : params.binary) {
          if (b.agree == true) {
            cats.add(b.category);
          }
        }
        flagged = true;
      }

      // Zero-shot groups. A multi-label group gives the list of labels at or above its
      // threshold; a single-label group gives its top label and confidence.
      for (def g : params.zero_shot) {
        def r = ml[g.name];
        if (r == null || r.top_classes == null || r.top_classes.isEmpty()) {
          continue;
        }
        // Per-label scores: scores.<group>.<key>.
        Map gs = new HashMap();
        for (def lc : r.top_classes) {
          gs[g.keys.getOrDefault(lc.class_name, lc.class_name)] = lc.class_probability;
        }
        scores[g.name] = gs;

        if (g.multi) {
          List out = new ArrayList();
          // Optional corroboration: another model's score must also be elevated.
          boolean corroborated = true;
          if (g.corroborate != null) {
            corroborated = false;
            for (def e : g.corroborate.entrySet()) {
              def v = scores[e.getKey()];
              if (v != null && v >= e.getValue()) {
                corroborated = true;
              }
            }
          }
          for (def c : r.top_classes) {
            if (!corroborated || c.class_probability < g.t) {
              continue;
            }
            String k = g.keys.getOrDefault(c.class_name, c.class_name);
            out.add(k);
            cats.add(g.name + ':' + k);
            if (g.flag.contains(k)) {
              flagged = true;
            }
          }
          if (!out.isEmpty()) {
            pc[g.name] = out;
          }
        } else {
          // Optional risk score: the summed probability of all non-benign labels. When no
          // single label passes, a risk at or above risk_t marks the group suspicious.
          if (g.risk_t != null) {
            double risk = 0;
            for (def rc : r.top_classes) {
              if (!g.benign.contains(g.keys.getOrDefault(rc.class_name, rc.class_name))) {
                risk += rc.class_probability;
              }
            }
            scores[g.name + '_risk'] = risk;
            def c0 = r.top_classes[0];
            boolean topHit = c0.class_probability >= g.t
                && !g.benign.contains(g.keys.getOrDefault(c0.class_name, c0.class_name));
            if (g.risk_t > 0 && !topHit && risk >= g.risk_t) {
              pc[g.name] = 'suspicious';
              cats.add(g.name + ':suspicious');
              flagged = true;
            }
          }
          def c = r.top_classes[0];
          String top = g.keys.getOrDefault(c.class_name, c.class_name);
          if (c.class_probability >= g.t && !g.benign.contains(top)) {
            String k = g.keys.getOrDefault(c.class_name, c.class_name);
            pc[g.name] = k;
            pc[g.name + '_confidence'] = c.class_probability;
            cats.add(g.name + ':' + k);
            if (g.flag.contains(k)) {
              flagged = true;
            }
          }
        }
      }

      // NER: entities by type, plus pii:<type> categories.
      Map entities = new HashMap();
      if (ml.ner?.entities != null) {
        for (def e : ml.ner.entities) {
          if (e.class_probability < params.t_entity || params.ner_ignore.contains(e.entity)) {
            continue;
          }
          String k = params.ner_types.getOrDefault(e.class_name, 'misc');
          if (!entities.containsKey(k)) {
            entities[k] = new ArrayList();
          }
          if (!entities[k].contains(e.entity)) {
            entities[k].add(e.entity);
          }
        }
        for (String k : entities.keySet()) {
          if (k != 'misc') {
            cats.add('pii:' + k);
            if (params.pii_flag_types.contains(k)) {
              flagged = true;
            }
          }
        }
      }

      pc.categories = cats;
      pc.scores = scores;
      if (!entities.isEmpty()) {
        pc.entities = entities;
      }
      pc.flagged = flagged;
    lang: painless
    params:
      zero_shot:
      - risk_t: 0
        flag:
        - malware_exploit_dev
        - phishing_social_engineering
        - credential_theft
        - security_bypass
        - detection_evasion
        - reconnaissance
        - data_exfiltration
        - privilege_escalation
        t: 0.93
        keys:
          malware or exploit development: malware_exploit_dev
          network scanning or reconnaissance: reconnaissance
          defensive security or detection engineering: defensive_security
          stealing or cracking credentials: credential_theft
          phishing or social engineering: phishing_social_engineering
          bypassing security controls: security_bypass
          normal software or IT work: normal_work
          data exfiltration: data_exfiltration
          evading antivirus or detection: detection_evasion
          privilege escalation: privilege_escalation
          casual conversation: casual_conversation
        name: security
        benign:
        - normal_work
        - casual_conversation
        - defensive_security
        multi: false
      - flag:
        - destructive
        - disable_security_tooling
        - access_change
        t: 0.6
        keys:
          deploying or pushing code: deploy
          asking a question or reading information: read_only
          changing production systems: production_change
          deleting or dropping data, indices, files or infrastructure: destructive
          disabling logging, monitoring or security tools: disable_security_tooling
          changing access permissions or user accounts: access_change
          writing or editing code: edit_code
          casual conversation: casual_conversation
        name: agent_action
        benign:
        - read_only
        - edit_code
        - casual_conversation
        multi: false
      - flag: []
        t: 0.3
        keys:
          a request to fix a bug or error: fix_bug
          a request to refactor or improve code: refactor
          a request to write non-technical text such as emails or reports: non_technical_writing
          feedback on a previous answer: feedback
          a request to write tests: write_tests
          a request for infrastructure, DevOps or configuration work: infra_devops
          a general knowledge question: general_question
          a request to review code: review_code
          a request to write documentation: documentation
          a request to write new code: write_code
          a request to explain or understand code: explain_code
          a request to query or analyze data: data_analysis
          a request to plan or design a system: design_planning
        name: task
        benign:
        - feedback
        multi: false
      - flag: []
        t: 0.85
        keys:
          thanks or praise: satisfaction
          a question about Claude itself: assistant_usage
          a complaint that something is wrong: correction
          an instruction or task request: instruction
        name: interaction
        benign:
        - instruction
        multi: false
      - flag:
        - violence
        - self_harm
        - sexual_content
        - hate_speech
        - harassment
        - illegal_activity
        - weapons
        t: 0.95
        keys:
          illegal activity: illegal_activity
          self-harm: self_harm
          hate speech: hate_speech
          harassment: harassment
          weapons: weapons
          sexual content: sexual_content
          violence: violence
        name: moderation
        benign: []
        corroborate:
          offensive: 0.35
          toxic: 0.1
        multi: true
      ner_ignore:
      - Claude
      - Anthropic
      - Claude Code
      binary:
      - name: injection
        label: INJECTION
        agree: true
        category: prompt_injection
        t: 0.9
      - name: jailbreak
        label: jailbreak
        agree: true
        category: jailbreak
        t: 0.99
      - name: toxicity
        label: toxic
        category: toxic
        t: 0.7
      - name: offensive
        label: offensive
        category: offensive
        t: 0.8
      t_entity: 0.8
      ner_types:
        MISC: misc
        LOC: location
        PER: person
        ORG: organization
      pii_flag_types:
      - person
- script:
    description: >-
      Copy the transcript pipeline's secret findings (claude_code.secrets: count, types and
      findings) into claude_code.prompt_classification.secrets, add a secret:<type>
      category for each type, and set flagged, so that one field set covers every reason a
      prompt is flagged.
    tag: secrets
    source: |
      def s = ctx.claude_code.secrets;
      def pc = ctx.claude_code.prompt_classification;
      if (pc == null) {
        pc = new HashMap();
        ctx.claude_code.prompt_classification = pc;
      }
      Map copy = new HashMap();
      copy.put('count', s.count);
      copy.put('types', s.types);
      copy.put('findings', s.findings);
      pc.secrets = copy;
      if (pc.categories == null) {
        pc.categories = new ArrayList();
      }
      for (def t : s.types) {
        pc.categories.add('secret:' + t);
      }
      pc.flagged = true;
    lang: painless
    if: ctx.claude_code?.secrets?.types != null
- remove:
    description: Remove the raw model outputs.
    field: claude_code.tmp.ml
    ignore_missing: true
    tag: remove_ml
on_failure:
- append:
    tag: append_error_message_on_failure
    field: error.message
    value: >-
      Processor '{{{ _ingest.on_failure_processor_type }}}'
      {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
      {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
      failed with message '{{{ _ingest.on_failure_message }}}'
- set:
    tag: set_event_kind_pipeline_error
    field: event.kind
    value: pipeline_error
- append:
    tag: append_tags_preserve_original_event_on_failure
    field: tags
    value: preserve_original_event
    allow_duplicates: false
- remove:
    field: claude_code.tmp.ml
    ignore_missing: true
    tag: remove_temp_fields_on_failure
