- script:
    description: >-
      Copy the inputs of tool_use blocks, already redacted, into mapped and searchable
      fields: claude_code.tool_input.command, file_path (file_path and path inputs), url,
      description and skill. Commands longer than 8000 characters are split into chunks
      that overlap by 256 characters, because logsdb keyword and wildcard fields stop
      indexing values at 8191 characters.
    tag: extract-tool-input
    source: |
      void addChunks(List out, String s) {
        if (s.length() <= 8000) {
          out.add(s);
          return;
        }
        int start = 0;
        while (start < s.length()) {
          int end = start + 8000;
          if (end > s.length()) {
            end = s.length();
          }
          out.add(s.substring(start, end));
          if (end == s.length()) {
            break;
          }
          start = end - 256;
        }
      }

      def cc = ctx.claude_code;
      if (cc == null || !(cc.message instanceof Map) || !(cc.message.content instanceof List)) {
        return;
      }
      List cmds = new ArrayList();
      List files = new ArrayList();
      List urls = new ArrayList();
      List descs = new ArrayList();
      List skills = new ArrayList();
      for (def b : cc.message.content) {
        if (!(b instanceof Map) || b.type != 'tool_use' || !(b.input instanceof Map)) {
          continue;
        }
        def inp = b.input;
        if (inp.command instanceof String) {
          addChunks(cmds, inp.command);
        }
        if (inp.file_path instanceof String && !files.contains(inp.file_path)) {
          files.add(inp.file_path);
        }
        if (inp.path instanceof String && !files.contains(inp.path)) {
          files.add(inp.path);
        }
        if (inp.url instanceof String && !urls.contains(inp.url)) {
          urls.add(inp.url);
        }
        if (inp.description instanceof String) {
          descs.add(inp.description);
        }
        if (inp.skill instanceof String && !skills.contains(inp.skill)) {
          skills.add(inp.skill);
        }
      }

      Map ti = new HashMap();
      if (!cmds.isEmpty()) {
        ti.put('command', cmds);
      }
      if (!files.isEmpty()) {
        ti.put('file_path', files);
      }
      if (!urls.isEmpty()) {
        ti.put('url', urls);
      }
      if (!descs.isEmpty()) {
        ti.put('description', descs);
      }
      if (!skills.isEmpty()) {
        ti.put('skill', skills);
      }
      if (!ti.isEmpty()) {
        cc.tool_input = ti;
      } else if (cc.tool_input != null) {
        cc.remove('tool_input');
      }
    lang: painless
    if: ctx.claude_code != null
- pipeline:
    tag: inference
    name: '{{ IngestPipeline "inference" }}'
    description: >-
      Optional ML inference, switched on by the integration's Enable ML inference and Prompt
      classification settings (the claude_code_embed and claude_code_classify tags): prompt
      embedding, NLP classification and semantic threat flags, for human prompts only.
      Inference failures never block indexing.
    if: ctx.tags != null && (ctx.tags.contains('claude_code_embed') || ctx.tags.contains('claude_code_classify'))
    ignore_failure: true
- script:
    tag: drop-inference-tags
    lang: painless
    description: >-
      Remove the internal claude_code_embed and claude_code_classify tags, which only switch
      inference on, and remove tags when it is left empty.
    if: ctx.tags instanceof List
    source: |
      ctx.tags.removeIf(t -> t == 'claude_code_embed' || t == 'claude_code_classify');
      if (ctx.tags.isEmpty()) {
        ctx.remove('tags');
      }
- remove:
    description: Working fields of the inference pipelines; normally already removed there.
    field:
    - claude_code.tmp
    ignore_missing: true
    tag: remove_tmp
- set:
    if: ctx.error?.message != null
    field: event.kind
    value: pipeline_error
    tag: set_event_kind_pipeline_error_on_error_message
- append:
    if: ctx.error?.message != null
    field: tags
    value: preserve_original_event
    allow_duplicates: false
    tag: append_tags_preserve_original_event_on_error_message
on_failure:
# If a processor failed before the redact-secrets script finished (it sets
# claude_code.tmp.redacted), fail closed: drop every field that holds text from the line,
# and cut the failure messages out of error.message, because they can quote the line. The
# processor type, tag and pipeline are kept for troubleshooting. A failure after
# redaction keeps the event as it is.
- remove:
    tag: remove_unredacted_fields_on_failure
    if: ctx.claude_code?.tmp?.redacted != true
    field:
    - message
    - claude_code
    - gen_ai
    - process.working_directory
    ignore_missing: true
- append:
    tag: append_error_message_on_failure
    field: error.message
    value: >-
      Processor '{{{ _ingest.on_failure_processor_type }}}'
      {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
      {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
      failed with message '{{{ _ingest.on_failure_message }}}'
- gsub:
    tag: gsub_error_message_drop_unscanned_text_on_failure
    if: ctx.claude_code?.tmp?.redacted != true
    field: error.message
    pattern: (?s)failed with message '.*'$
    replacement: >-
      failed; the failure message and the line were dropped because they had not been
      scanned for credentials
- append:
