- script:
    description: tool_use inputs -> claude_code.tool_input.* (command chunked for logsdb ignore_above)
    tag: extract-tool-input
    source: |
      // Copy tool_use inputs (already redacted) into mapped, searchable fields under claude_code.tool_input.
      // Long commands are chunked (8000 chars, 256 overlap) because logsdb wildcard/keyword fields stop indexing at 8191.
      void addChunks(List out, String s) {
        if (s.length() <= 8000) { out.add(s); return; }
        int start = 0;
        while (start < s.length()) {
          int end = start + 8000; if (end > s.length()) { end = s.length(); }
          out.add(s.substring(start, end));
          if (end == s.length()) { break; }
          start = end - 256;
        }
      }
      def cc = ctx.claude_code;
      if (cc == null || !(cc.message instanceof Map) || !(cc.message.content instanceof List)) { return; }
      List cmds = new ArrayList(); List files = new ArrayList(); List urls = new ArrayList(); List descs = new ArrayList(); List skills = new ArrayList();
      for (def b : cc.message.content) {
        if (!(b instanceof Map) || b.type != 'tool_use' || !(b.input instanceof Map)) { continue; }
        def inp = b.input;
        if (inp.command instanceof String) { addChunks(cmds, inp.command); }
        if (inp.file_path instanceof String && !files.contains(inp.file_path)) { files.add(inp.file_path); }
        if (inp.path instanceof String && !files.contains(inp.path)) { files.add(inp.path); }
        if (inp.url instanceof String && !urls.contains(inp.url)) { urls.add(inp.url); }
        if (inp.description instanceof String) { descs.add(inp.description); }
        if (inp.skill instanceof String && !skills.contains(inp.skill)) { skills.add(inp.skill); }
      }
      Map ti = new HashMap();
      if (!cmds.isEmpty()) { ti.put('command', cmds); }
      if (!files.isEmpty()) { ti.put('file_path', files); }
      if (!urls.isEmpty()) { ti.put('url', urls); }
      if (!descs.isEmpty()) { ti.put('description', descs); }
      if (!skills.isEmpty()) { ti.put('skill', skills); }
      if (!ti.isEmpty()) { cc.tool_input = ti; } else if (cc.tool_input != null) { cc.remove('tool_input'); }
    lang: painless
    if: ctx.claude_code != null
- pipeline:
    tag: inference
    name: '{{ IngestPipeline "inference" }}'
    description: 'Optional ML inference (integration setting ''Enable ML inference''): embedding + prompt classification'
    if: ctx.tags != null && (ctx.tags.contains('claude_code_embed') || ctx.tags.contains('claude_code_classify'))
    ignore_failure: true
- script:
    tag: drop-inference-tags
    lang: painless
    description: Remove the internal inference switch tags
    if: ctx.tags instanceof List
    source: ctx.tags.removeIf(t -> t == 'claude_code_embed' || t == 'claude_code_classify'); if (ctx.tags.isEmpty()) { ctx.remove('tags'); }
on_failure:
- append:
    tag: append_error_message_on_failure
    field: error.message
    value: Processor '{{{ _ingest.on_failure_processor_type }}}' {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}' {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'
- set:
    tag: set_event_kind_pipeline_error
    field: event.kind
    value: pipeline_error
