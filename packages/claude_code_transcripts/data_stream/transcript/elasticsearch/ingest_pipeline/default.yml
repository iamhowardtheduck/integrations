---
description: Claude Code session transcripts (JSONL) to ECS + gen_ai.*, with secret redaction
processors:
- drop:
    description: >-
      Keep only conversation lines (type user or assistant). Lines that failed JSON parsing
      have no claude_code object and are kept, with the parser's error.message, for
      troubleshooting.
    if: ctx.claude_code != null && ctx.claude_code.type != 'user' && ctx.claude_code.type != 'assistant'
    tag: drop_keep_only_conversation_lines_json_parse_
- date:
    ignore_failure: true
    formats:
    - ISO8601
    field: claude_code.timestamp
    tag: date_claude_code_timestamp
- set:
    field: event.kind
    value: event
    tag: set_event_kind
- set:
    field: service.name
    value: claude-code
    tag: set_service_name
- set:
    field: gen_ai.system
    value: anthropic
    tag: set_gen_ai_system
- set:
    ignore_empty_value: true
    field: event.id
    copy_from: claude_code.uuid
    tag: set_event_id
- set:
    description: Resumed sessions re-write earlier lines into a new file; same uuid -> same _id
    field: _id
    if: ctx.claude_code?.uuid != null
    value: '{{{claude_code.uuid}}}'
    tag: set_id
- set:
    ignore_empty_value: true
    field: service.version
    copy_from: claude_code.version
    tag: set_service_version
- set:
    ignore_empty_value: true
    field: process.working_directory
    copy_from: claude_code.cwd
    tag: set_process_working_directory
- set:
    ignore_empty_value: true
    field: gen_ai.conversation.id
    copy_from: claude_code.sessionId
    tag: set_gen_ai_conversation_id
- set:
    ignore_empty_value: true
    field: gen_ai.response.model
    copy_from: claude_code.message.model
    tag: set_gen_ai_response_model
- set:
    ignore_empty_value: true
    field: gen_ai.response.id
    copy_from: claude_code.message.id
    tag: set_gen_ai_response_id
- set:
    ignore_empty_value: true
    field: gen_ai.usage.output_tokens
    copy_from: claude_code.message.usage.output_tokens
    tag: set_gen_ai_usage_output_tokens
- append:
    field: gen_ai.response.finish_reasons
    if: ctx.claude_code?.message?.stop_reason != null
    value: '{{{claude_code.message.stop_reason}}}'
    tag: append_gen_ai_response_finish_reasons
- grok:
    ignore_failure: true
    field: log.file.path
    patterns:
    - (?i)%{SEP}(?:Users|home)%{SEP}%{SEG:user.name}%{SEP}(?:.*?%{SEP})?\.claude%{SEP}projects%{SEP}%{SEG:claude_code.project_slug}%{SEP}
    - ^/%{ROOTUSER:user.name}/\.claude/projects/%{SEG:claude_code.project_slug}/
    - (?i)%{SEP}(?:Users|home)%{SEP}%{SEG:user.name}%{SEP}
    - ^/%{ROOTUSER:user.name}/
    description: >-
      User and project from the file path (Windows, Linux, macOS; Claude Code and Cowork
      layouts). Desktop session files outside .claude/projects (claude-code-sessions,
      local-agent-mode-sessions) give the user only. ROOTUSER names the literal "root" so
      that it can be captured into user.name.
    ignore_missing: true
    pattern_definitions:
      SEG: '[^\\/]+'
      ROOTUSER: root
      SEP: '[\\/]'
    tag: grok_log_file_path
- append:
    field: related.user
    allow_duplicates: false
    if: ctx.user?.name != null
    value: '{{{user.name}}}'
    tag: append_related_user
- remove:
    description: >-
      The raw JSON line. Its content is parsed into claude_code by the agent, and message is
      rebuilt from the text blocks below, after which it is redacted.
    field: message
    ignore_missing: true
    tag: remove_message
- script:
    description: >-
      Build message from the text blocks of claude_code.message.content (normalising a
      plain-string content into one text block), list the tool_use names in
      claude_code.tool_names, and classify the line into event.action: user-prompt,
      subagent-prompt, local-command (slash commands and meta lines), system-notification
      (text injected by Claude Code itself), tool-result, assistant-response, tool-use or
      assistant-thinking. claude_code.human_prompt is true only for user-prompt, the lines
      a person typed.
    source: |
      def cc = ctx.claude_code;
      def msg = cc.message;
      def content = (msg instanceof Map) ? msg.content : null;

      // Normalise: content is either a plain string or a list of blocks.
      if (content instanceof String) {
        def block = new HashMap();
        block.put('type', 'text');
        block.put('text', content);
        def l = new ArrayList();
        l.add(block);
        msg.content = l;
        content = l;
      }

      StringBuilder sb = new StringBuilder();
      List tools = new ArrayList();
      boolean toolResult = false;

      if (content instanceof List) {
        for (def b : content) {
          if (!(b instanceof Map)) {
            continue;
          }
          if (b.type == 'text' && b.text != null) {
            if (sb.length() > 0) {
              sb.append((char) 10);
            }
            sb.append(b.text.toString());
          } else if (b.type == 'tool_use' && b.name != null) {
            tools.add(b.name);
          } else if (b.type == 'tool_result') {
            toolResult = true;
          }
        }
      }

      String text = sb.toString();
      if (text.length() > 0) {
        ctx.message = text;
      }
      if (!tools.isEmpty()) {
        cc.tool_names = tools;
      }

      boolean meta = cc.isMeta == true || cc.isCompactSummary == true;
      boolean wrapper = text.startsWith('<command-') || text.startsWith('<local-command');
      // Injected by Claude Code itself (background-task notifications and so on), not typed
      // by a person.
      def origin = cc.origin;
      boolean systemInjected = cc.promptSource == 'system'
          || (origin instanceof Map && origin.kind != null && origin.kind != 'human')
          || text.startsWith('<task-notification>')
          || text.startsWith('[Request interrupted by user');

      String action;
      if (cc.type == 'user') {
        if (toolResult) {
          action = 'tool-result';
        } else if (systemInjected) {
          action = 'system-notification';
        } else if (meta || wrapper) {
          action = 'local-command';
        } else if (cc.isSidechain == true) {
          action = 'subagent-prompt';
        } else {
          action = 'user-prompt';
        }
      } else {
        if (text.length() > 0) {
          action = 'assistant-response';
        } else if (!tools.isEmpty()) {
          action = 'tool-use';
        } else {
          action = 'assistant-thinking';
        }
      }

      if (ctx.event == null) {
        ctx.event = new HashMap();
      }
      ctx.event.action = action;
      cc.human_prompt = (action == 'user-prompt');
    lang: painless
    if: ctx.claude_code != null
    tag: script_flatten_message_content_into_ecs_message
- set:
    description: OTel name; gen_ai.system (ECS name, deprecated in OTel) is kept for ECS consumers
    field: gen_ai.provider.name
    value: anthropic
    tag: set_gen_ai_provider_name
- set:
    ignore_empty_value: true
    field: gen_ai.request.model
    copy_from: claude_code.requestedModel
    tag: set_gen_ai_request_model
- set:
    field: ecs.version
    value: 9.3.0
    tag: set_ecs_version
- script:
    on_failure:
    - append:
        field: error.message
        value: >-
          Processor '{{{ _ingest.on_failure_processor_type }}}'
          {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
          {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
          failed with message '{{{ _ingest.on_failure_message }}}'
        tag: gen-ai-align_on_failure_append_error_message
    description: >-
      Align with the OpenTelemetry GenAI conventions. gen_ai.operation.name is chat for
      prompts and responses, execute_tool for tool results and invoke_agent for subagent
      prompts. gen_ai.tool.call.id lists the tool_use and tool_result ids, and
      gen_ai.tool.name the tool names. gen_ai.usage.input_tokens includes cached tokens, as
      OTel requires, so it is Anthropic's input_tokens plus cache reads and cache writes;
      the cache split is kept in gen_ai.usage.cache_read and gen_ai.usage.cache_creation.
    tag: gen-ai-align
    source: |
      def cc = ctx.claude_code;
      if (ctx.gen_ai == null) {
        ctx.gen_ai = new HashMap();
      }
      def g = ctx.gen_ai;

      // Operation (OTel well-known values).
      String a = ctx.event?.action;
      String op = null;
      if (a == 'user-prompt' || a == 'assistant-response' || a == 'assistant-thinking' || a == 'tool-use') {
        op = 'chat';
      } else if (a == 'tool-result') {
        op = 'execute_tool';
      } else if (a == 'subagent-prompt') {
        op = 'invoke_agent';
      }
      if (op != null) {
        if (g.operation == null) {
          g.operation = new HashMap();
        }
        g.operation.name = op;
      }

      // Tool calls: ids from tool_use.id and tool_result.tool_use_id, names from tool_use.name.
      def content = (cc.message instanceof Map) ? cc.message.content : null;
      List ids = new ArrayList();
      if (content instanceof List) {
        for (def b : content) {
          if (!(b instanceof Map)) {
            continue;
          }
          def id = b.type == 'tool_use' ? b.id : (b.type == 'tool_result' ? b.tool_use_id : null);
          if (id != null && !ids.contains(id)) {
            ids.add(id.toString());
          }
        }
      }
      if (!ids.isEmpty() || cc.tool_names != null) {
        if (g.tool == null) {
          g.tool = new HashMap();
        }
        if (!ids.isEmpty()) {
          g.tool.call = ['id': ids];
        }
        if (cc.tool_names != null) {
          g.tool.name = cc.tool_names;
        }
      }

      // Tokens: OTel says gen_ai.usage.input_tokens SHOULD include cached tokens.
      // Anthropic's input_tokens excludes them, so total = input + cache_read + cache_creation.
      def u = (cc.message instanceof Map) ? cc.message.usage : null;
      if (u instanceof Map && u.input_tokens != null) {
        long inp = ((Number) u.input_tokens).longValue();
        long cr = u.cache_read_input_tokens instanceof Number
            ? ((Number) u.cache_read_input_tokens).longValue() : 0L;
        long cw = u.cache_creation_input_tokens instanceof Number
            ? ((Number) u.cache_creation_input_tokens).longValue() : 0L;
        if (g.usage == null) {
          g.usage = new HashMap();
        }
        g.usage.input_tokens = inp + cr + cw;
        g.usage.cache_read = ['input_tokens': cr];
        g.usage.cache_creation = ['input_tokens': cw];
      }
    lang: painless
    if: ctx.claude_code != null
- remove:
    description: >-
      claude_code.toolUseResult is a bulky duplicate of the tool output already in
      claude_code.message.content; delete this processor in a custom pipeline to keep it.
      claude_code.timestamp is already in @timestamp.
    ignore_missing: true
    field:
    - claude_code.toolUseResult
    - claude_code.timestamp
    tag: remove_claude_code_tooluseresult
- script:
    description: >-
      Give tool_result content one shape: a plain-string content becomes a list with one
      {type: text, text: ...} block, like the list form, so that
      claude_code.message.content.content maps consistently.
    tag: normalize-tool-result
    source: |
      def cc = ctx.claude_code;
      if (cc == null || !(cc.message instanceof Map) || !(cc.message.content instanceof List)) {
        return;
      }
      for (def b : cc.message.content) {
        if (b instanceof Map && b.type == 'tool_result' && b.content instanceof String) {
          Map t = new HashMap();
          t.put('type', 'text');
          t.put('text', b.content);
          List l = new ArrayList();
          l.add(t);
          b.content = l;
        }
      }
    lang: painless
    if: ctx.claude_code != null
- script:
    on_failure:
    - remove:
        description: >-
          Fail closed: the line could not be scanned for credentials, so drop every field that
          holds text from it. The event is kept, as a pipeline_error, to show that a line was
          dropped.
        field:
        - message
        - claude_code
        - gen_ai
        - process.working_directory
        - error
        ignore_missing: true
        tag: redact-secrets_on_failure_remove_unredacted_fields
    - append:
        description: >-
          The failure message is left out, because a Painless error message can quote the
          text it was working on.
        field: error.message
        value: >-
          Processor '{{{ _ingest.on_failure_processor_type }}}'
          {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
          {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
          failed; the line was dropped because it could not be scanned for credentials
        tag: redact-secrets_on_failure_append_error_message
    - append:
        field: claude_code.secrets.errors
        value: redaction script failed
        tag: redact-secrets_on_failure_append_claude_code_secrets_errors
    - append:
        field: tags
        value: claude_code_redaction_failed
        tag: redact-secrets_on_failure_append_tags
    description: >-
      Find credentials in every field that holds text from the line (message, claude_code.*,
      including prompts, responses, tool inputs and tool output, gen_ai.*,
      process.working_directory and error.*) and replace each, in every written form, with
      [REDACTED:<type>]. Only the type and length of each finding are recorded, in
      claude_code.secrets; the values themselves are never stored. scan() below explains
      what is detected and how. If the script fails, its handler drops those fields instead
      of storing them unredacted.
    tag: redact-secrets
    source: |
      // plausible() decides whether a captured value looks like a real secret rather than a
      // placeholder or prose: stop words ("required", "your", ...), template variables ($VAR,
      // <value>, {value}, %VAR%), paths, masks such as **** or xxxx, and our own
      // [REDACTED:...] marker are rejected. With strong set, the value must also contain a
      // digit or symbol; this is used for the plain-language "password is X" pattern.
      boolean plausible(String v, List stop, boolean strong) {
        if (v == null) {
          return false;
        }
        String s = v.trim();
        while (s.length() > 0 && ".,;:!?)]}'\"`".indexOf(s.substring(s.length() - 1)) >= 0) {
          s = s.substring(0, s.length() - 1);
        }
        if (s.length() < 4) {
          return false;
        }
        if (stop.contains(s.toLowerCase())) {
          return false;
        }
        if (s.startsWith('[REDACTED')) {
          return false;
        }

        // A leading $ < { % / ~ or . marks a variable, placeholder or path.
        char c0 = s.charAt(0);
        if (c0 == (char) 36 || c0 == (char) 60 || c0 == (char) 123 || c0 == (char) 37
            || c0 == (char) 47 || c0 == (char) 126 || c0 == (char) 46) {
          return false;
        }

        // A value made only of * x X or . is a mask.
        boolean allMask = true;
        for (int i = 0; i < s.length(); i++) {
          char ch = s.charAt(i);
          if (ch != (char) 42 && ch != (char) 120 && ch != (char) 88 && ch != (char) 46) {
            allMask = false;
            break;
          }
        }
        if (allMask) {
          return false;
        }

        if (!strong) {
          return true;
        }
        for (int i = 0; i < s.length(); i++) {
          if (!Character.isLetter(s.charAt(i))) {
            return true;
          }
        }
        return false;
      }

      // hit() records one finding. Values are de-duplicated, so the first (most specific)
      // type to claim a value wins. The value itself is kept only in memory, in seen, for
      // the replacement step; the finding records its type and length.
      // hit() trims trailing punctuation from values found in free text; hitExact() is used
      // when the value's boundaries are known, as for a JSON string.
      void hit(List f, List seen, String type, String raw) {
        String val = raw.trim();
        while (val.length() > 0 && ".,;:!?)]}'\"`".indexOf(val.substring(val.length() - 1)) >= 0) {
          val = val.substring(0, val.length() - 1);
        }
        hitExact(f, seen, type, val);
      }

      void hitExact(List f, List seen, String type, String val) {
        // Weak, context-free types need longer values.
        int minLen = (type == 'password' || type == 'sudo_password') ? 4 : 6;
        if (val.length() < minLen || seen.contains(val)) {
          return;
        }
        seen.add(val);
        Map m = new HashMap();
        m.put('type', type);
        m.put('length', val.length());
        f.add(m);
      }

      // variant() adds another written form of a found value (such as its raw, escaped JSON
      // text) to the values to replace. It is marked as a variant so that it is not counted
      // as a separate finding.
      void variant(List f, List seen, String type, String val) {
        if (val.length() < 4 || seen.contains(val)) {
          return;
        }
        seen.add(val);
        Map m = new HashMap();
        m.put('type', type);
        m.put('variant', true);
        f.add(m);
      }

      // unescapeOne() decodes the JSON escape sequence that starts with the backslash at
      // t[i], appends the decoded character to sb, and returns the index after the sequence.
      int unescapeOne(String t, int i, StringBuilder sb) {
        char e = t.charAt(i + 1);
        if (e == (char) 110) {
          sb.append((char) 10);
        } else if (e == (char) 116) {
          sb.append((char) 9);
        } else if (e == (char) 114) {
          sb.append((char) 13);
        } else if (e == (char) 98) {
          sb.append((char) 8);
        } else if (e == (char) 102) {
          sb.append((char) 12);
        } else if (e == (char) 117 && i + 5 < t.length()) {
          try {
            sb.append((char) Integer.parseInt(t.substring(i + 2, i + 6), 16));
            return i + 6;
          } catch (NumberFormatException x) {
            sb.append(e);
          }
        } else {
          // \" \\ \/ and anything else: the character itself.
          sb.append(e);
        }
        return i + 2;
      }

      // jsonString() reads a JSON string value from t, starting at i (just after its opening
      // quote) and following escapes up to the closing quote, or to the end of t when the
      // text was cut short. It returns the decoded value and the index of the closing quote.
      List jsonString(String t, int i) {
        StringBuilder sb = new StringBuilder();
        int n = t.length();
        while (i < n) {
          char c = t.charAt(i);
          if (c == (char) 34) {
            break;
          }
          if (c == (char) 92 && i + 1 < n) {
            i = unescapeOne(t, i, sb);
          } else {
            sb.append(c);
            i++;
          }
        }
        return [sb.toString(), i];
      }

      // unescape() undoes one level of JSON string escaping, for JSON that was itself
      // written inside a JSON string (\"key\": \"value\").
      String unescape(String s) {
        StringBuilder sb = new StringBuilder();
        int n = s.length();
        int i = 0;
        while (i < n) {
          if (s.charAt(i) == (char) 92 && i + 1 < n) {
            i = unescapeOne(s, i, sb);
          } else {
            sb.append(s.charAt(i));
            i++;
          }
        }
        return sb.toString();
      }

      // jsonEscape() escapes a value the way JSON.stringify does: quote, backslash and
      // control characters. A value found decoded (for example in a tool input) can be
      // written escaped in tool output that contains JSON, so both forms must be replaced.
      String jsonEscape(String s) {
        StringBuilder sb = new StringBuilder();
        for (int i = 0; i < s.length(); i++) {
          char c = s.charAt(i);
          if (c == (char) 34 || c == (char) 92) {
            sb.append((char) 92);
            sb.append(c);
          } else if (c == (char) 10) {
            sb.append('\\n');
          } else if (c == (char) 13) {
            sb.append('\\r');
          } else if (c == (char) 9) {
            sb.append('\\t');
          } else if (c == (char) 8) {
            sb.append('\\b');
          } else if (c == (char) 12) {
            sb.append('\\f');
          } else if (c < (char) 32) {
            String h = Integer.toHexString((int) c);
            sb.append('\\u');
            sb.append('0000'.substring(h.length()));
            sb.append(h);
          } else {
            sb.append(c);
          }
        }
        return sb.toString();
      }

      // findAll() records every match of a fixed-format pattern. Each pattern runs in its own
      // try/catch so a pattern that fails (for example, on the regex complexity limit) only
      // adds its name to errs. The exception message is not kept, because Painless regex
      // errors echo the input text.
      void findAll(String text, Pattern p, int group, String type, String name,
                   List f, List seen, List errs) {
        try {
          Matcher m = p.matcher(text);
          while (m.find()) {
            hit(f, seen, type, m.group(group));
          }
        } catch (Exception e) {
          errs.add(name);
        }
      }

      // sensitiveKey() is true when a field or JSON key names a credential. The key is
      // lowercased and stripped of _ - and . first, so apiKey, api_key and API-KEY all match.
      boolean sensitiveKey(def k, def params) {
        if (k == null) {
          return false;
        }
        String n = k.toString().toLowerCase().replace('_', '').replace('-', '').replace('.', '');
        if (params.secret_keys.contains(n)) {
          return true;
        }
        for (def sfx : params.secret_key_suffixes) {
          if (n.endsWith((String) sfx)) {
            return true;
          }
        }
        return false;
      }

      String keyType(def k) {
        String n = k.toString().toLowerCase();
        return (n.indexOf('pass') >= 0 || n.indexOf('pwd') >= 0) ? 'password' : 'secret_field';
      }

      // keyHit() records the string value of a map entry whose key names a credential.
      void keyHit(List f, List seen, def k, def v, def params) {
        if (!(v instanceof String) || !sensitiveKey(k, params)) {
          return;
        }
        // The whole value is the secret, whatever its length.
        String s = (String) v;
        if (!plausible(s, params.stop, false)) {
          return;
        }
        hitExact(f, seen, keyType(k), s);
      }

      // scan() finds credentials in one string and records each one with hit().
      //
      // Intent: catch secrets that end up in transcripts (pasted tokens, connection strings,
      // CLI flags in tool commands, "the password is ..." in prose) with few false
      // positives, and never fail the document because of the scan.
      //
      // Approach, from most to least specific. Because hit() de-duplicates by value, a value
      // keeps the type of the first pattern that found it.
      //   1. Fixed-format tokens with a distinctive prefix or shape: cloud and SaaS API keys,
      //      PEM private key blocks, JWTs and Authorization headers. One regex each.
      //   2. JSON "key": "value" pairs, including backslash-escaped JSON, where the key names
      //      a credential (params.secret_keys and params.secret_key_suffixes).
      //   3. Context patterns: NAME=value with NAME containing PASSWORD, SECRET, TOKEN or
      //      API_KEY; echo ... | sudo -S; curl "user = name:pass" configs; -u/--user CLI
      //      credentials; plain-language "password is X"; and scheme://user:pass@host URLs.
      //      These find a keyword with indexOf and run a short, anchored regex on a bounded
      //      window after it, instead of one unanchored regex over the whole text. That keeps
      //      the cost linear in the text length and avoids backtracking on long lines.
      // Captured values from groups 2 and 3 must also pass plausible().
      void scan(String text, List f, List seen, List errs, def params) {
        if (text == null || text.length() < 4) {
          return;
        }
        List stop = params.stop;
        def m;

        // 1. Fixed-format tokens.
        findAll(text, /A(?:KIA|SIA|BIA|CCA)[0-9A-Z]{16}/, 0,
            'aws_access_key', 'aws_access_key', f, seen, errs);
        findAll(text, /(?i)aws[_ \-]?secret[_ \-]?(?:access[_ \-]?)?key["']?\s?[=:]\s?['"]?([A-Za-z0-9\/+=]{40})(?![A-Za-z0-9\/+=])/, 1,
            'aws_secret_key', 'aws_secret_key', f, seen, errs);
        findAll(text, /gh[pousr]_[A-Za-z0-9]{36}/, 0,
            'github_token', 'github_token', f, seen, errs);
        findAll(text, /github_pat_[A-Za-z0-9_]{60,}/, 0,
            'github_token', 'github_pat', f, seen, errs);
        findAll(text, /glpat-[A-Za-z0-9_\-]{20,}/, 0,
            'gitlab_token', 'gitlab_token', f, seen, errs);
        findAll(text, /xox[abposr]-[A-Za-z0-9\-]{10,}/, 0,
            'slack_token', 'slack_token', f, seen, errs);
        findAll(text, /https:\/\/hooks\.slack\.com\/services\/[A-Za-z0-9\/]{20,}/, 0,
            'slack_webhook', 'slack_webhook', f, seen, errs);
        findAll(text, /sk-ant-[A-Za-z0-9_\-]{20,}/, 0,
            'anthropic_api_key', 'anthropic_api_key', f, seen, errs);
        findAll(text, /(?<![A-Za-z0-9])sk-(?!ant-)(?:proj-|svcacct-)?[A-Za-z0-9_\-]{32,}/, 0,
            'openai_api_key', 'openai_api_key', f, seen, errs);
        findAll(text, /AIza[0-9A-Za-z_\-]{35}/, 0,
            'google_api_key', 'google_api_key', f, seen, errs);
        findAll(text, /[sr]k_live_[0-9A-Za-z]{24,}/, 0,
            'stripe_key', 'stripe_key', f, seen, errs);
        // The whole PEM block: BEGIN line, optional headers, base64 body (raw or with
        // escaped \r\n newlines, as in JSON text) and END line.
        findAll(text, /-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----(?:(?:\\r)?(?:\\n|\r?\n)[A-Za-z\-]{2,16}: ?[^\r\n\\]*)*(?:[A-Za-z0-9+\/=\r\n]|\\[rn])*(?:-----END (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----)?/, 0,
            'private_key', 'private_key', f, seen, errs);
        findAll(text, /eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}/, 0,
            'jwt', 'jwt', f, seen, errs);
        findAll(text, /(?i)authorization\s?[:=]\s?['"]?(?:apikey|bearer|basic) ([A-Za-z0-9+\/=._\-]{16,})/, 1,
            'auth_header', 'auth_header', f, seen, errs);

        // 2. "key": "value" in JSON text where the key names a credential, including JSON
        // that is itself escaped inside a string (\"key\": \"value\"). The regex finds only the
        // key and the opening quote of the value; jsonString() then reads the value up to its
        // closing quote, following escapes, so a value with spaces, escaped quotes or any
        // length is redacted whole.
        try {
          m = /\\?"([A-Za-z0-9_.\-]{1,64})\\?"\s{0,8}:\s{0,8}(\\?)"/.matcher(text);
          while (m.find()) {
            String key = m.group(1);
            if (!sensitiveKey(key, params)) {
              continue;
            }
            int vs = m.end();
            String val;
            String raw = null;
            if (m.group(2).isEmpty()) {
              List r = jsonString(text, vs);
              val = (String) r.get(0);
              raw = text.substring(vs, (int) r.get(1));
            } else {
              // Escaped JSON: undo one level of escaping, then read the value.
              val = (String) jsonString(unescape(text.substring(vs)), 0).get(0);
            }
            if (plausible(val, stop, false)) {
              hitExact(f, seen, keyType(key), val);
              // The value as written in the text, which may use escapes such as A.
              if (raw != null) {
                variant(f, seen, keyType(key), raw);
              }
            }
          }
        } catch (Exception e) {
          errs.add('json_secret_field');
        }

        // 3a. NAME=value or "NAME": "value", where NAME is an upper-case identifier that
        // contains one of params.env_keywords. The identifier is widened around the
        // keyword by hand, then an anchored regex reads the value from a 120-character window.
        try {
          int tl = text.length();
          for (def kwd : params.env_keywords) {
            String kw = (String) kwd;
            int from = 0;
            while (true) {
              int p = text.indexOf(kw, from);
              if (p < 0) {
                break;
              }
              from = p + kw.length();

              // Widen to the whole identifier: A-Z, 0-9 and _ on both sides.
              int s0 = p;
              while (s0 > 0) {
                char ch = text.charAt(s0 - 1);
                if ((ch >= (char) 65 && ch <= (char) 90) || (ch >= (char) 48 && ch <= (char) 57) || ch == (char) 95) {
                  s0--;
                } else {
                  break;
                }
              }
              int e0 = from;
              while (e0 < tl) {
                char ch = text.charAt(e0);
                if ((ch >= (char) 65 && ch <= (char) 90) || (ch >= (char) 48 && ch <= (char) 57) || ch == (char) 95) {
                  e0++;
                } else {
                  break;
                }
              }
              // Skip a keyword inside a lowercase or mixed-case word.
              if (s0 > 0 && Character.isLetterOrDigit(text.charAt(s0 - 1))) {
                continue;
              }
              from = e0;

              int we = e0 + 120;
              if (we > tl) {
                we = tl;
              }
              m = /^['"]? ?[=:] ?['"]?([^\s'",}]{4,})/.matcher(text.substring(e0, we));
              if (m.find() && plausible(m.group(1), stop, false)) {
                hit(f, seen, 'env_secret', m.group(1));
              }
            }
          }
        } catch (Exception e) {
          errs.add('env_secret');
        }

        // 3b. echo 'secret' | sudo -S, and curl config "user = name:pass".
        try {
          m = /echo ['"]?([^\s'"|]{4,})['"]? ?\| ?sudo -S/.matcher(text);
          while (m.find()) {
            if (plausible(m.group(1), stop, false)) {
              hit(f, seen, 'sudo_password', m.group(1));
            }
          }
        } catch (Exception e) {
          errs.add('sudo_password');
        }
        try {
          m = /(?<![A-Za-z0-9_])user ?= ?['"]?[^\s:'"]{1,64}:([^\s'"]{4,})/.matcher(text);
          while (m.find()) {
            if (plausible(m.group(1), stop, false)) {
              hit(f, seen, 'basic_auth_cli', m.group(1));
            }
          }
        } catch (Exception e) {
          errs.add('curl_config');
        }

        // 3c. CLI credentials: -u user:pass, -u user -p pass, --user/--username ... --password ...
        // The flag must start a word; the regexes read a 200-character window from it.
        try {
          int tl = text.length();
          for (def kwd : params.cli_flags) {
            String kw = (String) kwd;
            int from = 0;
            while (true) {
              int p = text.indexOf(kw, from);
              if (p < 0) {
                break;
              }
              from = p + kw.length();
              if (p > 0) {
                char pc0 = text.charAt(p - 1);
                if (!(Character.isWhitespace(pc0) || pc0 == (char) 39 || pc0 == (char) 34)) {
                  continue;
                }
              }
              int we = p + 200;
              if (we > tl) {
                we = tl;
              }
              String w = text.substring(p, we);
              m = /^(?:-u|--user|--username)[ =]['"]?[^\s:'"]{1,64}:([^\s'"@]{3,})/.matcher(w);
              if (m.find() && plausible(m.group(1), stop, false)) {
                hit(f, seen, 'basic_auth_cli', m.group(1));
              }
              m = /^(?:-u|--user|--username)[ =]['"]?[^\s'"]{1,64}['"]? (?:-p ?|--password[ =])['"]?([^\s'"]{4,})/.matcher(w);
              if (m.find() && plausible(m.group(1), stop, false)) {
                hit(f, seen, 'cli_password', m.group(1));
              }
            }
          }
        } catch (Exception e) {
          errs.add('cli_credentials');
        }

        // 3d. Plain language: "password is X", "api key: X", "secret key X1!". The keyword
        // must start a word; the regex reads a 96-character window after it, and the value
        // must pass the strong plausibility check.
        try {
          String lower = text.toLowerCase();
          int tl = text.length();
          for (def kwd : params.pw_keywords) {
            String kw = (String) kwd;
            int kl = kw.length();
            int from = 0;
            while (true) {
              int p = lower.indexOf(kw, from);
              if (p < 0) {
                break;
              }
              from = p + kl;
              if (p > 0 && Character.isLetterOrDigit(lower.charAt(p - 1))) {
                continue;
              }
              int we = p + kl + 96;
              if (we > tl) {
                we = tl;
              }
              String win = text.substring(p + kl, we);
              m = /^s?(?![A-Za-z0-9_])(?: (?:is|was)(?![A-Za-z0-9])| ?[=:]| (?=\S*[0-9!@#$%^&*]))(?: also(?![A-Za-z0-9]))? ?[:=]? {0,3}['"]?([^\s'",;]{4,})/.matcher(win);
              if (m.find() && plausible(m.group(1), stop, true)) {
                hit(f, seen, 'password', m.group(1));
              }
            }
          }
        } catch (Exception e) {
          errs.add('password');
        }

        // 3e. scheme://user:pass@host, parsed without a regex.
        try {
          int from = 0;
          while (true) {
            int p = text.indexOf('://', from);
            if (p < 0) {
              break;
            }
            // The authority ends at whitespace, / ' or ".
            int end = p + 3;
            while (end < text.length()) {
              char ch = text.charAt(end);
              if (Character.isWhitespace(ch) || ch == (char) 47 || ch == (char) 39 || ch == (char) 34) {
                break;
              }
              end++;
            }
            String auth = text.substring(p + 3, end);
            int at = auth.lastIndexOf('@');
            if (at > 0) {
              int col = auth.indexOf(':');
              if (col > 0 && col < at) {
                String pw = auth.substring(col + 1, at);
                if (pw.length() >= 3 && plausible(pw, stop, false)) {
                  hit(f, seen, 'url_credentials', pw);
                }
              }
            }
            from = end;
          }
        } catch (Exception e) {
          errs.add('url_credentials');
        }
      }

      // walkScan() scans every string in a value, and every map entry whose key names a
      // credential. Nesting is capped at 25 levels.
      void walkScan(def o, List f, List seen, List errs, def params, int depth) {
        if (o == null || depth > 25) {
          return;
        }
        if (o instanceof String) {
          scan((String) o, f, seen, errs, params);
        } else if (o instanceof Map) {
          for (def e : ((Map) o).entrySet()) {
            walkScan(e.getValue(), f, seen, errs, params, depth + 1);
            keyHit(f, seen, e.getKey(), e.getValue(), params);
          }
        } else if (o instanceof List) {
          for (def v : (List) o) {
            walkScan(v, f, seen, errs, params, depth + 1);
          }
        }
      }

      // walkReplace() replaces every found value with its [REDACTED:<type>] tag, in place.
      // Anything nested deeper than walkScan() reads was never scanned, so it is replaced
      // with [TRUNCATED:depth] rather than kept. Deep values are all inside flattened or
      // unmapped objects (claude_code is dynamic: false), so a string there maps safely.
      def walkReplace(def o, List vals, List tags, int depth) {
        if (o == null) {
          return o;
        }
        if (depth > 25) {
          return '[TRUNCATED:depth]';
        }
        if (o instanceof String) {
          String s = (String) o;
          for (int i = 0; i < vals.size(); i++) {
            String v = (String) vals.get(i);
            if (s.indexOf(v) >= 0) {
              s = s.replace(v, (String) tags.get(i));
            }
          }
          return s;
        }
        if (o instanceof Map) {
          Map mp = (Map) o;
          for (def k : new ArrayList(mp.keySet())) {
            mp.put(k, walkReplace(mp.get(k), vals, tags, depth + 1));
          }
          return mp;
        }
        if (o instanceof List) {
          List l = (List) o;
          for (int i = 0; i < l.size(); i++) {
            l.set(i, walkReplace(l.get(i), vals, tags, depth + 1));
          }
          return l;
        }
        return o;
      }

      // Main: scan every field that holds text from the transcript line, then redact them
      // all. That is all of claude_code (prompts, responses, tool inputs and output, and
      // metadata such as cwd), gen_ai (tool call ids and names, copied from the content by
      // gen-ai-align), process.working_directory, message and error.*.
      def cc = ctx.claude_code;
      if (cc == null) {
        return;
      }
      List f = new ArrayList();
      List seen = new ArrayList();
      List errs = new ArrayList();
      walkScan(ctx.message, f, seen, errs, params, 0);
      walkScan(cc, f, seen, errs, params, 0);
      if (ctx.gen_ai != null) {
        walkScan(ctx.gen_ai, f, seen, errs, params, 0);
      }
      if (ctx.process?.working_directory != null) {
        walkScan(ctx.process.working_directory, f, seen, errs, params, 0);
      }
      if (ctx.error != null) {
        walkScan(ctx.error, f, seen, errs, params, 0);
      }

      // The values to replace: each found value, plus its JSON-escaped forms, which is how
      // a value appears in tool output that contains JSON. Longer values are replaced first,
      // so a value that contains another is replaced whole.
      List rv = new ArrayList();
      List rt = new ArrayList();
      for (int i = 0; i < seen.size(); i++) {
        String v = (String) seen.get(i);
        String tag = '[REDACTED:' + f.get(i).type + ']';
        String e1 = jsonEscape(v);
        String e2 = jsonEscape(e1);
        rv.add(v);
        rt.add(tag);
        if (e1 != v) {
          rv.add(e1);
          rt.add(tag);
        }
        if (e2 != e1) {
          rv.add(e2);
          rt.add(tag);
        }
      }
      List order = new ArrayList();
      for (int i = 0; i < rv.size(); i++) {
        order.add(i);
      }
      order.sort((a, b) -> ((String) rv.get(b)).length() - ((String) rv.get(a)).length());
      List vals = new ArrayList();
      List tags = new ArrayList();
      for (def i : order) {
        vals.add(rv.get(i));
        tags.add(rt.get(i));
      }

      // Replace even when nothing was found, so that values too deeply nested to scan are
      // always cut.
      if (ctx.message != null) {
        ctx.message = walkReplace(ctx.message, vals, tags, 0);
      }
      ctx.claude_code = walkReplace(cc, vals, tags, 0);
      if (ctx.gen_ai != null) {
        ctx.gen_ai = walkReplace(ctx.gen_ai, vals, tags, 0);
      }
      if (ctx.process?.working_directory != null) {
        ctx.process.working_directory = walkReplace(ctx.process.working_directory, vals, tags, 0);
      }
      if (ctx.error != null) {
        ctx.error = walkReplace(ctx.error, vals, tags, 0);
      }

      // Tell the pipeline's failure handler that the fields are now safe to keep.
      if (cc.tmp == null) {
        cc.tmp = new HashMap();
      }
      cc.tmp.redacted = true;

      // Findings, without the variants (other written forms of the same values).
      List found = new ArrayList();
      for (def x : f) {
        if (x.variant != true) {
          found.add(x);
        }
      }
      if (found.isEmpty() && errs.isEmpty()) {
        return;
      }

      Map sec = new HashMap();
      if (!errs.isEmpty()) {
        List el = new ArrayList();
        for (def e : errs) {
          el.add('pattern ' + e + ' could not be evaluated');
        }
        sec.put('errors', el);
      }
      if (!found.isEmpty()) {
        List types = new ArrayList();
        for (def x : found) {
          if (!types.contains(x.type)) {
            types.add(x.type);
          }
        }
        sec.put('count', found.size());
        sec.put('types', types);
        sec.put('findings', found);
        sec.put('redacted', true);
      }
      cc.secrets = sec;
